<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Resumo do carrinho e dados de entrega da tua encomenda.">
  <title>Encomendas — Forno &amp; Pizza</title>
  <link rel="icon" href="img/logo-icone.webp">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <header class="cabecalho">
    <div class="container cabecalho-conteudo">
      <a class="logo" href="index.html">
        <img class="logo-icone" src="img/logo-icone.webp" alt="" width="44" height="44">
        <span>FORNO &amp; PIZZA</span>
      </a>
      <nav class="menu" aria-label="Navegação principal">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="monta.html">Monta a Tua Pizza</a></li>
        <li><a href="sobre.html">Sobre Nós</a></li>
        <li><a href="encomendas.html" class="ativo" aria-current="page">Encomendas</a></li>
        <li><a href="contactos.html">Contactos</a></li>
        <li><a class="carrinho" href="encomendas.html" aria-label="Carrinho, 0 artigos"><svg class="icone" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.2a1 1 0 0 0 1-.8L19 8H6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="19.5" r="1.5" fill="currentColor"/><circle cx="17" cy="19.5" r="1.5" fill="currentColor"/></svg><span>0</span></a></li>
      </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container pagina">
      <h1>Encomendas</h1>
      <div class="encomenda-grelha">

        <section class="caixa">
          <h2>Resumo do carrinho</h2>
          <ul class="linhas" id="lista-carrinho">
            <!-- O JavaScript vai preencher os itens aqui -->
          </ul>
          <p class="total">Total: <strong id="total-carrinho">€0,00</strong></p>
        </section>

        <section class="caixa">
          <h2>Entrega e pagamento</h2>
          <form action="index.html" method="get">
            <label for="nome-e">Nome</label>
            <input id="nome-e" name="nome" type="text" required>
            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel" required>
            <label for="morada">Morada de entrega</label>
            <input id="morada" name="morada" type="text" required>
            <fieldset>
              <legend>Pagamento (simulado)</legend>
              <label class="opcao"><span><input type="radio" name="pagamento" value="cartao" checked> Cartão</span></label>
              <label class="opcao"><span><input type="radio" name="pagamento" value="mbway"> MB WAY</span></label>
              <label class="opcao"><span><input type="radio" name="pagamento" value="entrega"> Dinheiro na entrega</span></label>
            </fieldset>
            <button class="botao" type="button" id="btn-finalizar">Confirmar encomenda</button>
          </form>
        </section>

      </div>
    </div>
  </main>

  <footer class="rodape">
    <div class="container">
      <p>© 2026 Forno &amp; Pizza · <a href="menu.html">Menu</a> · <a href="contactos.html">Contactos</a></p>
    </div>
  </footer>

  <div id="modal-loading" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center; text-align:center;">
      <div style="background:white; padding:2rem; border-radius:12px; max-width:400px;">
          <img src="img/logo-icone.webp" alt="Logo" style="width:100px; margin:0 auto 1rem auto; animation: spin 2s linear infinite;">
          <h2 style="color: #C0392B;">A processar a tua encomenda...</h2>
      </div>
  </div>
  <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>

  <script src="js/script.js"></script>
</body>
</html>
